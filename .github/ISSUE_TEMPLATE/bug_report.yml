# File: .github/ISSUE_TEMPLATE/bug_report.yml
# Role: Structured bug-report form.
# Use: Collects reproducible details without requesting private information.

name: Bug report
description: Report a reproducible problem with the portfolio foundation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, private contact details, or other sensitive data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps that reproduces the issue.
      placeholder: "1. Open ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "For example, Firefox 140"
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Operating system and whether this is local, preview, or production."
